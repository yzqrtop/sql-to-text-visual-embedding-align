<text x="278.4" y="75.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">WITH BigOrders AS (</text>
<text x="278.4" y="98.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">  OUTPUT CustomerId, Total</text>
<text x="278.4" y="121.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">  FROM orders o</text>
<text x="278.4" y="144.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">  WHERE Total &gt; 100</text>
<text x="278.4" y="167.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">)</text>
<text x="278.4" y="190.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">OUTPUT CustomerId, Total</text>
<text x="278.4" y="213.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">FROM BigOrders;</text>
