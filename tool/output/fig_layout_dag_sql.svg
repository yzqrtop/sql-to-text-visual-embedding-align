<text x="169.1" y="36.0" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="15" fill="#111111" font-weight="bold">SQL</text>
<rect x="169.1" y="48.0" width="429.9" height="191.0" rx="4" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="185.1" y="75.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">WITH CustOrders AS (</text>
<text x="185.1" y="98.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">  OUTPUT o.CustomerId, c.Name, o.Total</text>
<text x="185.1" y="121.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">  FROM orders o</text>
<text x="185.1" y="144.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">  JOIN customers c ON o.CustomerId = c.CustomerId</text>
<text x="185.1" y="167.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">)</text>
<text x="185.1" y="190.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">OUTPUT Name, Total</text>
<text x="185.1" y="213.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">FROM CustOrders;</text>
