<text x="1040.2" y="140.4" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="13.5" fill="#111111">  WHERE Total &gt; 100</text>
<text x="1040.2" y="162.4" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="13.5" fill="#111111">)</text>
