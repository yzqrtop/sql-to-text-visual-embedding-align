<svg xmlns="http://www.w3.org/2000/svg" width="768" height="718" viewBox="0 0 768 718">
<rect x="0" y="0" width="768" height="718" fill="#ffffff"/>
<text x="185.3" y="36.0" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="15" fill="#111111" font-weight="bold">SQL</text>
<rect x="185.3" y="48.0" width="397.4" height="168.0" rx="4" fill="#f7f7f7" stroke="#999999" stroke-width="1.2"/>
<text x="201.3" y="75.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">OUTPUT a.Name, s.Total</text>
<text x="201.3" y="98.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">FROM artists a</text>
<text x="201.3" y="121.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">JOIN ArtistSales s ON a.ArtistId = s.ArtistId</text>
<text x="201.3" y="144.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">GROUP BY a.ArtistId</text>
<text x="201.3" y="167.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">ORDER BY SUM(s.Total) DESC</text>
<text x="201.3" y="190.9" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="14.0" fill="#111111">LIMIT 1;</text>
