t="normal">with</text><rect x="640.64" y="224.15246725082397" width="18.360000000000003" height="8" fill="#8E44AD" fill-opacity="0.28" rx="2" /><text x="570.0" y="248.15246725082397" fill="#8E44AD" font-size="10" font-weight="normal">count</text><rect x="642.22" y="240.15246725082397" width="16.78" height="8" fill="#8E44AD" fill-opacity="0.25" rx="2" /><text x="570.0" y="264.152467250824" fill="#8E44AD" font-size="10" font-weight="normal">department</text><rect x="642.72" y="256.152467250824" width="16.28" height="8" fill="#8E44AD" fill-opacity="0.24" rx="2" /><rect x="439.9343169927597" y="269.152467250824" width="105" height="70" fill="#27AE60" fill-opacity="0.08" stroke="#27AE60" stroke-width="1" stroke-dasharray="3,2" rx="4" ry="4" /><text x="445.9343169927597" y="282.152467250824" fill="#27AE60" font-size="9" font-weight="bold">NL attn: Result</text><line x1="439.9343169927597" y1="304.152467250824" x2="427.9343169927597" y2="312.30803310871124" stroke="#27AE60" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" /><text x="447.9343169927597" y="297.152467250824" fill="#27AE60" font-size="10" font-weight="normal">with</text><rect x="518.5743169927597" y="289.152467250824" width="18.360000000000003" height="8" fill="#27AE60" fill-opacity="0.28" rx="2" /><text x="447.9343169927597" y="313.152467250824" fill="#27AE60" font-size="10" font-weight="normal">count</text><rect x="520.1543169927597" y="305.152467250824" width="16.78" height="8" fill="#27AE60" fill-opacity="0.25" rx="2" /><text x="447.9343169927597" y="329.152467250824" fill="#27AE60" font-size="10" font-weight="normal">department</text><rect x="520.6543169927597" y="321.152467250824" width="16.28" height="8" fill="#27AE60" fill-opacity="0.24" rx="2" /><text x="20" y="444.01643574237823" fill="#2C3E50" font-size="12" font-weight="bold">Query: </text><text x="70" y="444.01643574237823" fill="#34495E" font-size="11">Show department names with employee counts</text><text x="20" y="458.01643574237823" fill="#2C3E50" font-size="11" font-weight="bold">SQL: </text><text x="60" y="474.01643574237823" fill="#7F8C8D" font-size="10">SELECT d.name, s.cnt FROM departments d JOIN (SELECT dept_id, COUNT(*) as cnt FROM</text><text x="60" y="486.01643574237823" fill="#7F8C8D" font-size="10">employees GROUP BY dept_id) s ON d.id = s.dept_id</text></svg>