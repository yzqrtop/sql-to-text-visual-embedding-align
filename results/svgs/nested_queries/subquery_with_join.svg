42.7890300750732" fill="#2C3E50" font-size="12" font-weight="bold">Query: </text><text x="70" y="542.7890300750732" fill="#34495E" font-size="11">Find employees earning more than their department ...</text><text x="20" y="556.7890300750732" fill="#2C3E50" font-size="11" font-weight="bold">SQL: </text><text x="60" y="572.7890300750732" fill="#7F8C8D" font-size="10">SELECT e.name, d.name FROM employees e JOIN departments d ON e.dept_id = d.id WHERE</text><text x="60" y="584.7890300750732" fill="#7F8C8D" font-size="10">e.salary &gt; (SELECT AVG(salary) FROM employees WHERE dept_id = e.dept_id)</text></svg>