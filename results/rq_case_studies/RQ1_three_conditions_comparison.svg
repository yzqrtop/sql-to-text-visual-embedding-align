8.0" y1="368" x2="452.0" y2="368" stroke="#1E8449" stroke-opacity="0.3" /><ns0:text x="400.0" y="372" text-anchor="middle" fill="#1E8449" font-size="13">department</ns0:text><ns0:line x1="348.0" y1="390" x2="452.0" y2="390" stroke="#1E8449" stroke-opacity="0.3" /><ns0:text x="400.0" y="394" text-anchor="middle" fill="#1E8449" font-size="13">COUNT(*)</ns0:text><ns0:rect x="620" y="30" width="12" height="12" fill="#4A90D9" fill-opacity="0.8" /><ns0:text x="640" y="40" fill="#2C3E50" font-size="13" font-weight="bold">Container</ns0:text><ns0:text x="680" y="40" fill="#7F8C8D" font-size="12">Table/Result</ns0:text><ns0:rect x="620" y="65" width="12" height="12" fill="#FFB347" fill-opacity="0.8" /><ns0:text x="640" y="75" fill="#2C3E50" font-size="13" font-weight="bold">Funnel</ns0:text><ns0:text x="680" y="75" fill="#7F8C8D" font-size="12">WHERE/HAVING</ns0:text><ns0:rect x="620" y="100" width="12" height="12" fill="#1ABC9C" fill-opacity="0.8" /><ns0:text x="640" y="110" fill="#2C3E50" font-size="13" font-weight="bold">Stack</ns0:text><ns0:text x="680" y="110" fill="#7F8C8D" font-size="12">GROUP BY</ns0:text><ns0:rect x="472.0" y="45" width="70" height="70" fill="#2980B9" fill-opacity="0.08" stroke="#2980B9" stroke-width="1" stroke-dasharray="3,2" rx="4" ry="4" /><ns0:text x="478.0" y="58" fill="#2980B9" font-size="9" font-weight="bold">NL attn: Entity</ns0:text><ns0:line x1="472.0" y1="80.0" x2="460.0" y2="82.0" stroke="#2980B9" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" /><ns0:text x="480.0" y="73" fill="#2980B9" font-size="10" font-weight="bold">员工</ns0:text><ns0:rect x="512.48" y="65" width="21.52" height="8" fill="#2980B9" fill-opacity="0.32" rx="2" /><ns0:text x="480.0" y="89" fill="#2980B9" font-size="10" font-weight="bold">部门</ns0:text><ns0:rect x="513.96" y="81" width="20.04" height="8" fill="#2980B9" fill-opacity="0.30" rx="2" /><ns0:text x="480.0" y="105" fill="#2980B9" font-size="10" font-weight="normal">人的</ns0:text><ns0:rect x="514.18" y="97" width="19.82" height="8" fill="#2980B9" fill-opacity="0.30" rx="2" /><ns0:rect x="479.5" y="144" width="70" height="70" fill="#E67E22" fill-opacity="0.08" stroke="#E67E22" stroke-width="1" stroke-dasharray="3,2" rx="4" ry="4" /><ns0:text x="485.5" y="157" fill="#E67E22" font-size="9" font-weight="bold">NL attn: Cond</ns0:text><ns0:line x1="479.5" y1="179.0" x2="467.5" y2="181.5" stroke="#E67E22" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" /><ns0:text x="487.5" y="172" fill="#E67E22" font-size="10" font-weight="normal">人的</ns0:text><ns0:rect x="530.82" y="164" width="10.68" height="8" fill="#E67E22" fill-opacity="0.16" rx="2" /><ns0:text x="487.5" y="188" fill="#E67E22" font-size="10" font-weight="normal">30</ns0:text><ns0:rect x="530.88" y="180" width="10.620000000000001" height="8" fill="#E67E22" fill-opacity="0.16" rx="2" /><ns0:text x="487.5" y="204" fill="#E67E22" font-size="10" font-weight="normal">找出</ns0:text><ns0:rect x="531.74" y="196" width="9.76" height="8" fill="#E67E22" fill-opacity="0.15" rx="2" /><ns0:rect x="415.2438814640045" y="244" width="70" height="70" fill="#27AE60" fill-opacity="0.08" stroke="#27AE60" stroke-width="1" stroke-dasharray="3,2" rx="4" ry="4" /><ns0:text x="421.2438814640045" y="257" fill="#27AE60" font-size="9" font-weight="bold">NL attn: Result</ns0:text><ns0:line x1="415.2438814640045" y1="279.0" x2="403.2438814640045" y2="284.93725979328156" stroke="#27AE60" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" /><ns0:text x="423.2438814640045" y="272" fill="#27AE60" font-size="10" font-weight="normal">人的</ns0:text><ns0:rect x="466.5638814640045" y="264" width="10.68" height="8" fill="#27AE60" fill-opacity="0.16" rx="2" /><ns0:text x="423.2438814640045" y="288" fill="#27AE60" font-size="10" font-weight="normal">30</ns0:text><ns0:rect x="466.6238814640045" y="280" width="10.620000000000001" height="8" fill="#27AE60" fill-opacity="0.16" rx="2" /><ns0:text x="423.2438814640045" y="304" fill="#27AE60" font-size="10" font-weight="normal">找出</ns0:text><ns0:rect x="467.4838814640045" y="296" width="9.76" height="8" fill="#27AE60" fill-opacity="0.15" rx="2" /><ns0:text x="20" y="415.3112074136734" fill="#2C3E50" font-size="12" font-weight="bold">Query: </ns0:text><ns0:text x="70" y="415.3112074136734" fill="#34495E" font-size="11">找出30岁以上员工超过5人的部门</ns0:text><ns0:text x="20" y="429.3112074136734" fill="#2C3E50" font-size="11" font-weight="bold">SQL: </ns0:text><ns0:text x="60" y="445.3112074136734" fill="#7F8C8D" font-size="10">SELECT department, COUNT(*) FROM employees WHERE age &gt; 30 GROUP BY department HAVING</ns0:text><ns0:text x="60" y="457.3112074136734" fill="#7F8C8D" font-size="10">COUNT(*) &gt; 5</ns0:text></g><text x="955" y="485" fill="#E67E22" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">准确率: 84.9%</text><text x="955" y="510" fill="#E67E22" font-size="13" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">响应时间: 6.1s</text><text x="955" y="535" fill="#27AE60" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">优势:</text><text x="965" y="550" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 视觉隐喻直观展示结构</text><text x="965" y="550" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 漏斗=WHERE, 堆叠柱=GROUP BY</text><text x="965" y="550" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 无需SQL知识即可理解</text><text x="965" y="550" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 错误样本准确率81.1%</text><text x="250" y="570" fill="#3498DB" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">→ 语法高亮 +14.3% →</text><text x="710" y="570" fill="#E67E22" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">→ 视觉隐喻 +14.2% →</text><text x="1160" y="570" fill="#27AE60" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">✓ 最佳</text></svg>