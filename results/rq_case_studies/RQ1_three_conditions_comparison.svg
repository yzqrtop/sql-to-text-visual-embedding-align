<svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><rect x="0" y="0" width="1400" height="55" fill="#2C3E50" /><text x="700.0" y="25" fill="white" font-size="18" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">RQ1: 同一SQL在三种条件下的展示对比</text><text x="700.0" y="45" fill="#BDC3C7" font-size="12" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">A: Plain SQL  |  D: Color-Highlighted SQL  |  E: MetaphorSearch (Ours)</text><rect x="20" y="75" width="440" height="480" fill="#FAFAFA" stroke="#95A5A6" stroke-width="2" rx="8" ry="8" /><rect x="20" y="75" width="440" height="35" fill="#95A5A6" rx="8" ry="8" /><rect x="20" y="95" width="440" height="15" fill="#95A5A6" /><text x="240.0" y="98" fill="white" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">A: Plain SQL</text><rect x="35" y="125" width="410" height="100" fill="white" stroke="#CCC" stroke-width="1" rx="5" ry="5" /><text x="45" y="145" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT department, COUNT(*)</text><text x="45" y="163" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">FROM employees</text><text x="45" y="181" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">WHERE age &gt; 30</text><text x="45" y="199" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">GROUP BY department</text><text x="45" y="217" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">HAVING COUNT(*) &gt; 5</text><text x="35" y="245" fill="#7F8C8D" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">用户需要阅读SQL代码</text><text x="35" y="263" fill="#7F8C8D" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">理解每行语义后判断正确性</text><text x="35" y="295" fill="#95A5A6" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">准确率: 55.4%</text><text x="35" y="320" fill="#95A5A6" font-size="13" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">响应时间: 10.3s</text><text x="35" y="350" fill="#E74C3C" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">问题:</text><text x="45" y="370" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 需SQL知识才能理解</text><text x="45" y="388" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• WHERE与HAVING区别不直观</text><text x="45" y="406" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 聚合逻辑难以快速验证</text><text x="45" y="424" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 错误样本准确率仅48.3%</text><rect x="480" y="75" width="440" height="480" fill="#FAFAFA" stroke="#3498DB" stroke-width="2" rx="8" ry="8" /><rect x="480" y="75" width="440" height="35" fill="#3498DB" rx="8" ry="8" /><rect x="480" y="95" width="440" height="15" fill="#3498DB" /><text x="700.0" y="98" fill="white" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">D: Color-Highlighted SQL</text><rect x="495" y="125" width="410" height="100" fill="#1E1E1E" rx="5" ry="5" /><text x="505" y="145" fill="#D4D4D4" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT department, COUNT(*)</text><text x="505" y="163" fill="#D4D4D4" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">FROM employees</text><text x="505" y="181" fill="#D4D4D4" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">WHERE age &gt; 30</text><text x="505" y="199" fill="#D4D4D4" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">GROUP BY department</text><text x="505" y="217" fill="#D4D4D4" font-size="11" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">HAVING COUNT(*) &gt; 5</text><rect x="495" y="125" width="60" height="100" fill="none" opacity="0.300" stroke="#569CD6" stroke-width="1" rx="3" ry="3" /><text x="495" y="245" fill="#3498DB" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">关键字分色高亮</text><text x="495" y="263" fill="#7F8C8D" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">但仍需阅读代码理解</text><text x="495" y="295" fill="#3498DB" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">准确率: 70.7%</text><text x="495" y="320" fill="#3498DB" font-size="13" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">响应时间: 5.8s</text><text x="495" y="350" fill="#27AE60" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">改善:</text><text x="505" y="370" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 语法结构更清晰</text><text x="505" y="388" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 关键字/表名/列名分色</text><text x="505" y="406" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 仍需SQL知识理解</text><text x="505" y="424" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 错误样本准确率66.5%</text><rect x="940" y="75" width="440" height="480" fill="#FEF9E7" stroke="#E67E22" stroke-width="2" rx="8" ry="8" /><rect x="940" y="75" width="440" height="35" fill="#E67E22" rx="8" ry="8" /><rect x="940" y="95" width="440" height="15" fill="#E67E22" /><text x="1160.0" y="98" fill="white" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">E: MetaphorSearch (Ours)</text><defs><clipPath id="clip_950_120"><rect x="950" y="120" width="420" height="350" /></clipPath></defs><g transform="translate(950,120)" clip-path="url(#clip_950_120)"><ns0:defs><ns0:filter id="highBetaShadow" x="-30%" y="-30%" width="160%" height="160%"><ns0:feGaussianBlur stdDeviation="4" result="coloredBlur" /><ns0:feMerge><ns0:feMergeNode in="coloredBlur" /><ns0:feMergeNode in="SourceGraphic" /></ns0:feMerge></ns0:filter><ns0:filter id="lowBetaGrayscale"><ns0:feColorMatrix type="matrix" values="0.3 0.3 0.3 0 0  0.3 0.3 0.3 0 0  0.3 0.3 0.3 0 0  0 0 0 1 0" /></ns0:filter></ns0:defs><ns0:path d="M 400.0 134 L 400.0 124" stroke="#5DADE2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" /><ns0:line x1="400.0" y1="134" x2="394.0" y2="144.39230484541326" stroke="#3498DB" stroke-width="3" /><ns0:line x1="400.0" y1="134" x2="406.0" y2="144.39230484541326" stroke="#3498DB" stroke-width="3" /><ns0:path d="M 400.0 239 L 400.0 224" stroke="#5DADE2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" /><ns0:line x1="400.0" y1="234" x2="394.0" y2="244.39230484541326" stroke="#3498DB" stroke-width="3" /><ns0:line x1="400.0" y1="234" x2="406.0" y2="244.39230484541326" stroke="#3498DB" stroke-width="3" /><ns0:path d="M 400.0 345.8745195865631 L 400.0 319" stroke="#5DADE2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" /><ns0:line x1="400.0" y1="329" x2="394.0" y2="339.39230484541326" stroke="#3498DB" stroke-width="3" /><ns0:line x1="400.0" y1="329" x2="406.