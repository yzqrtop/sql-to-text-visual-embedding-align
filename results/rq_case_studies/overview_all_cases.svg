<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect x="0" y="0" width="1000" height="70" fill="#1A5276" /><text x="500.0" y="30" fill="white" font-size="22" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">RQ实验: 真实SQL案例可视化展示</text><text x="500.0" y="55" fill="#D6EAF8" font-size="13" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">5种错误类型 × 正确vs错误 对比 — MetaphorSearch视觉隐喻如何帮助识别SQL语义错误</text><rect x="30" y="100" width="940" height="100" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><circle cx="60" cy="145" r="20" fill="#2C3E50" /><text x="60" y="151" fill="white" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">1</text><text x="95" y="128" fill="#2C3E50" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Scope (WHERE vs HAVING)</text><text x="95" y="148" fill="#7F8C8D" font-size="12" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">过滤范围错误</text><text x="350" y="128" fill="#7F8C8D" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Q:</text><text x="375" y="128" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">找出平均工资大于50000的部门名称</text><text x="350" y="150" fill="#27AE60" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">正确:</text><text x="395" y="150" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT department FROM employees GROUP BY department HA...</text><text x="350" y="168" fill="#E74C3C" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误:</text><text x="395" y="168" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT department FROM employees WHERE AVG(salary) &gt; 50...</text><text x="350" y="190" fill="#F39C12" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">判别:</text><text x="395" y="190" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">注意漏斗(Funnel)的位置：</text><line x1="912.8" y1="135" x2="918.2" y2="141.3" stroke="#27AE60" stroke-width="4" /><line x1="918.2" y1="141.3" x2="928.1" y2="128.7" stroke="#27AE60" stroke-width="4" /><circle cx="920" cy="135" r="12.6" fill="none" stroke="#27AE60" stroke-width="2.5" /><line x1="951.0" y1="126.0" x2="969.0" y2="144.0" stroke="#E74C3C" stroke-width="4" /><line x1="951.0" y1="144.0" x2="969.0" y2="126.0" stroke="#E74C3C" stroke-width="4" /><circle cx="960" cy="135" r="12.6" fill="none" stroke="#E74C3C" stroke-width="2.5" /><text x="905" y="175" fill="#ABB2B9" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="end">case_1_scope.svg</text><rect x="30" y="210" width="940" height="100" fill="#F5F5F5" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><circle cx="60" cy="255" r="20" fill="#2C3E50" /><text x="60" y="261" fill="white" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">2</text><text x="95" y="238" fill="#2C3E50" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Aggregation Level</text><text x="95" y="258" fill="#7F8C8D" font-size="12" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">聚合层级错误</text><text x="350" y="238" fill="#7F8C8D" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Q:</text><text x="375" y="238" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">统计每个部门有多少员工</text><text x="350" y="260" fill="#27AE60" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">正确:</text><text x="395" y="260" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT department, COUNT(*) FROM employees GROUP BY dep...</text><text x="350" y="278" fill="#E74C3C" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误:</text><text x="395" y="278" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT department, COUNT(*) FROM employees</text><text x="350" y="300" fill="#F39C12" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">判别:</text><text x="395" y="300" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">注意堆叠柱(Stack)的分组：</text><line x1="912.8" y1="245" x2="918.2" y2="251.3" stroke="#27AE60" stroke-width="4" /><line x1="918.2" y1="251.3" x2="928.1" y2="238.7" stroke="#27AE60" stroke-width="4" /><circle cx="920" cy="245" r="12.6" fill="none" stroke="#27AE60" stroke-width="2.5" /><line x1="951.0" y1="236.0" x2="969.0" y2="254.0" stroke="#E74C3C" stroke-width="4" /><line x1="951.0" y1="254.0" x2="969.0" y2="236.0" stroke="#E74C3C" stroke-width="4" /><circle cx="960" cy="245" r="12.6" fill="none" stroke="#E74C3C" stroke-width="2.5" /><text x="905" y="285" fill="#ABB2B9" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="end">case_2_aggregation_level.svg</text><rect x="30" y="320" width="940" height="100" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><circle cx="60" cy="365" r="20" fill="#2C3E50" /><text x="60" y="371" fill="white" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">3</text><text x="95" y="348" fill="#2C3E50" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">JOIN Type Misuse</text><text x="95" y="368" fill="#7F8C8D" font-size="12" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">JOIN类型误用</text><text x="350" y="348" fill="#7F8C8D" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Q:</text><text x="375" y="348" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">列出所有员工及其部门名称（包括未分配部门的员工）</text><text x="350" y="370" fill="#27AE60" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">正确:</text><text x="395" y="370" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT e.name, d.name FROM employees e LEFT JOIN depart...</text><text x="350" y="388" fill="#E74C3C" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误:</text><text x="395" y="388" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT e.name, d.name FROM employees e INNER JOIN depar...</text><text x="350" y="410" fill="#F39C12" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">判别:</text><text x="395" y="410" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">注意分支(Branch)的连接方式：</text><line x1="912.8" y1="355" x2="918.2" y2="361.3" stroke="#27AE60" stroke-width="4" /><line x1="918.2" y1="361.3" x2="928.1" y2="348.7" stroke="#27AE60" stroke-width="4" /><circle cx="920" cy="355" r="12.6" fill="none" stroke="#27AE60" stroke-width="2.5" /><line x1="951.0" y1="346.0" x2="969.0" y2="364.0" stroke="#E74C3C" stroke-width="4" /><line x1="951.0" y1="364.0" x2="969.0" y2="346.0" stroke="#E74C3C" stroke-width="4" /><circle cx="960" cy="355" r="12.6" fill="none" stroke="#E74C3C" stroke-width="2.5" /><text x="905" y="395" fill="#ABB2B9" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="end">case_3_join_type_misuse.svg</text><rect x="30" y="430" width="940" height="100" fill="#F5F5F5" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><circle cx="60" cy="475" r="20" fill="#2C3E50" /><text x="60" y="481" fill="white" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">4</text><text x="95" y="458" fill="#2C3E50" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Column Parsing</text><text x="95" y="478" fill="#7F8C8D" font-size="12" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">列解析错误</text><text x="350" y="458" fill="#7F8C8D" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Q:</text><text x="375" y="458" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">查询每个学生的姓名和年龄</text><text x="350" y="480" fill="#27AE60" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">正确:</text><text x="395" y="480" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT name, age FROM students</text><text x="350" y="498" fill="#E74C3C" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误:</text><text x="395" y="498" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT name, gender FROM students</text><text x="350" y="520" fill="#F39C12" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">判别:</text><text x="395" y="520" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">注意结果容器(Result)中显示的列名：</text><line x1="912.8" y1="465" x2="918.2" y2="471.3" stroke="#27AE60" stroke-width="4" /><line x1="918.2" y1="471.3" x2="928.1" y2="458.7" stroke="#27AE60" stroke-width="4" /><circle cx="920" cy="465" r="12.6" fill="none" stroke="#27AE60" stroke-width="2.5" /><line x1="951.0" y1="456.0" x2="969.0" y2="474.0" stroke="#E74C3C" stroke-width="4" /><line x1="951.0" y1="474.0" x2="969.0" y2="456.0" stroke="#E74C3C" stroke-width="4" /><circle cx="960" cy="465" r="12.6" fill="none" stroke="#E74C3C" stroke-width="2.5" /><text x="905" y="505" fill="#ABB2B9" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="end">case_4_column_parsing.svg</text><rect x="30" y="540" width="940" height="100" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><circle cx="60" cy="585" r="20" fill="#2C3E50" /><text x="60" y="591" fill="white" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">5</text><text x="95" y="568" fill="#2C3E50" font-size="15" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Subquery Deviation</text><text x="95" y="588" fill="#7F8C8D" font-size="12" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">子查询偏差</text><text x="350" y="568" fill="#7F8C8D" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Q:</text><text x="375" y="568" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">找出工资高于公司平均工资的员工</text><text x="350" y="590" fill="#27AE60" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">正确:</text><text x="395" y="590" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT name FROM employees WHERE salary &gt; (SELECT AVG(s...</text><text x="350" y="608" fill="#E74C3C" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误:</text><text x="395" y="608" fill="#2C3E50" font-size="9" font-weight="normal" font-family="Courier New, monospace" text-anchor="start">SELECT name FROM employees WHERE salary &gt; (SELECT MAX(s...</text><text x="350" y="630" fill="#F39C12" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">判别:</text><text x="395" y="630" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">注意边界框(Boundary)内子查询的聚合函数：</text><line x1="912.8" y1="575" x2="918.2" y2="581.3" stroke="#27AE60" stroke-width="4" /><line x1="918.2" y1="581.3" x2="928.1" y2="568.7" stroke="#27AE60" stroke-width="4" /><circle cx="920" cy="575" r="12.6" fill="none" stroke="#27AE60" stroke-width="2.5" /><line x1="951.0" y1="566.0" x2="969.0" y2="584.0" stroke="#E74C3C" stroke-width="4" /><line x1="951.0" y1="584.0" x2="969.0" y2="566.0" stroke="#E74C3C" stroke-width="4" /><circle cx="960" cy="575" r="12.6" fill="none" stroke="#E74C3C" stroke-width="2.5" /><text x="905" y="615" fill="#ABB2B9" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="end">case_5_subquery_deviation.svg</text><rect x="30" y="645" width="940" height="40" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1" rx="8" ry="8" /><text x="50" y="665" fill="#1F618D" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">说明:</text><text x="95" y="665" fill="#2C3E50" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">每个案例SVG展示同一问题的正确SQL和错误SQL的可视化对比，通过视觉隐喻的差异（漏斗位置、堆叠柱分组、边界框内容等）帮助用户快速判别SQL语义正确性</text></svg>