<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><rect x="0" y="0" width="900" height="50" fill="#1A5276" /><text x="450.0" y="25" fill="white" font-size="18" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">MetaphorSearch 用户研究 — 问卷第2页: 实验设计</text><rect x="30" y="70" width="840" height="220" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><text x="50" y="95" fill="#1A5276" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">D. 实验条件 (Experimental Conditions)</text><rect x="50" y="103" width="30" height="24" fill="#95A5A6" rx="4" ry="4" /><text x="65" y="119" fill="white" font-size="13" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">A</text><text x="90" y="119" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Plain SQL</text><text x="280" y="119" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">纯SQL代码，等宽字体，无高亮</text><rect x="50" y="133" width="30" height="24" fill="#3498DB" rx="4" ry="4" /><text x="65" y="149" fill="white" font-size="13" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">D</text><text x="90" y="149" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Color-Highlighted SQL</text><text x="280" y="149" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">SQL语法高亮：关键字蓝/表名绿/列名橙</text><rect x="50" y="163" width="30" height="24" fill="#E67E22" rx="4" ry="4" /><text x="65" y="179" fill="white" font-size="13" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">E</text><text x="90" y="179" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">MetaphorSearch</text><text x="280" y="179" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">完整可视化管线：视觉隐喻图+NL注意力标注</text><text x="50" y="215" fill="#7F8C8D" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">补充基线 (附录):</text><text x="160" y="215" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B: Execution Plan Tree  |  C: LLM Text Explanation (GPT-4)</text><rect x="30" y="250" width="840" height="280" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><text x="50" y="275" fill="#1A5276" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">E. 拉丁方平衡设计 (Latin Square Counterbalancing)</text><text x="50" y="295" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">30名被试随机分配到3组，每组10人，消除顺序效应</text><text x="60" y="315" fill="#2C3E50" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">组别</text><text x="250" y="315" fill="#2C3E50" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">条件顺序 (Block 1 → Block 2 → Block 3)</text><text x="700" y="315" fill="#2C3E50" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">每Block样本</text><line x1="50" y1="323" x2="850" y2="323" stroke="#DDD" stroke-width="1" /><rect x="60" y="331" width="12" height="12" fill="#95A5A6" rx="2" ry="2" /><text x="80" y="343" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Group 1 (n=10)</text><rect x="250" y="331" width="30" height="22" fill="#95A5A6" rx="4" ry="4" /><text x="265" y="347" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">A</text><text x="290" y="347" fill="#BDC3C7" font-size="14" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">→</text><rect x="370" y="331" width="30" height="22" fill="#3498DB" rx="4" ry="4" /><text x="385" y="347" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">D</text><text x="410" y="347" fill="#BDC3C7" font-size="14" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">→</text><rect x="490" y="331" width="30" height="22" fill="#E67E22" rx="4" ry="4" /><text x="505" y="347" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">E</text><text x="720" y="343" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">20 (10一致+10错误)</text><rect x="60" y="361" width="12" height="12" fill="#3498DB" rx="2" ry="2" /><text x="80" y="373" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Group 2 (n=10)</text><rect x="250" y="361" width="30" height="22" fill="#3498DB" rx="4" ry="4" /><text x="265" y="377" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">D</text><text x="290" y="377" fill="#BDC3C7" font-size="14" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">→</text><rect x="370" y="361" width="30" height="22" fill="#E67E22" rx="4" ry="4" /><text x="385" y="377" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">E</text><text x="410" y="377" fill="#BDC3C7" font-size="14" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">→</text><rect x="490" y="361" width="30" height="22" fill="#95A5A6" rx="4" ry="4" /><text x="505" y="377" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">A</text><text x="720" y="373" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">20 (10一致+10错误)</text><rect x="60" y="391" width="12" height="12" fill="#E67E22" rx="2" ry="2" /><text x="80" y="403" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">Group 3 (n=10)</text><rect x="250" y="391" width="30" height="22" fill="#E67E22" rx="4" ry="4" /><text x="265" y="407" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">E</text><text x="290" y="407" fill="#BDC3C7" font-size="14" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">→</text><rect x="370" y="391" width="30" height="22" fill="#95A5A6" rx="4" ry="4" /><text x="385" y="407" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">A</text><text x="410" y="407" fill="#BDC3C7" font-size="14" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">→</text><rect x="490" y="391" width="30" height="22" fill="#3498DB" rx="4" ry="4" /><text x="505" y="407" fill="white" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">D</text><text x="720" y="403" fill="#7F8C8D" font-size="9" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">20 (10一致+10错误)</text><text x="60" y="443" fill="#E67E22" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">每位被试总计: 3条件 × 20样本 = 60次判断 + 2AFC 6×3 = 18次</text><text x="60" y="463" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">训练阶段: 5分钟教程 (含2个练习样本)，熟悉操作界面</text><rect x="30" y="503" width="840" height="220" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><text x="50" y="528" fill="#1A5276" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">F. 任务说明 (Task Instructions)</text><text x="60" y="553" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">F1. 意图验证 (Intent Verification):</text><text x="80" y="571" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">屏幕显示: 自然语言问题 + SQL(或可视化) + 执行结果</text><text x="80" y="587" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">任务: "这条SQL是否正确实现了用户意图？" → 选择 是 / 否</text><text x="60" y="613" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">F2. 2AFC二选一 (Two-Alternative Forced Choice):</text><text x="80" y="631" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">屏幕显示: 自然语言问题 + 两条SQL(A和B)</text><text x="80" y="647" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">任务: "哪条SQL更符合问题描述？" → 选择 A 或 B</text><text x="60" y="673" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">F3. 每次判断后记录:</text><text x="80" y="691" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 验证准确率 (是否正确)</text><text x="80" y="707" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 响应时间 (从刺激呈现到按键)</text></svg>