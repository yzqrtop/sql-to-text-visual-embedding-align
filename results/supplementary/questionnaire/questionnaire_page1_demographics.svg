<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><rect x="0" y="0" width="900" height="50" fill="#1A5276" /><text x="450.0" y="25" fill="white" font-size="18" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">MetaphorSearch 用户研究 — 问卷第1页: 人口统计与背景</text><text x="450.0" y="42" fill="#D6EAF8" font-size="11" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Participant ID: P___   |   Date: ____/____/____   |   Session: AM / PM</text><rect x="30" y="70" width="840" height="200" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><text x="50" y="95" fill="#1A5276" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">A. 人口统计信息 (Demographics)</text><text x="50" y="115" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">1. 年龄 (Age):</text><text x="260" y="115" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">______ 岁</text><text x="50" y="143" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">2. 性别 (Gender):</text><text x="260" y="143" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ 男(M)   □ 女(F)   □ 其他(Other)   □ 不愿透露(Prefer not to say)</text><text x="50" y="171" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">3. 专业 (Major):</text><text x="260" y="171" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ 人文(Humanities)   □ 社科(Social Science)   □ 理科(Science)   □ 工科(Engineering)   □ 其他:______</text><text x="50" y="199" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">4. 年级 (Year):</text><text x="260" y="199" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ 大一   □ 大二   □ 大三   □ 大四   □ 研究生</text><text x="50" y="227" fill="#2C3E50" font-size="11" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">5. 母语 (Native Language):</text><text x="260" y="227" fill="#555" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ 中文   □ English   □ 其他:______</text><rect x="30" y="265" width="840" height="250" fill="#FAFAFA" stroke="#DDD" stroke-width="1" rx="8" ry="8" /><text x="50" y="290" fill="#1A5276" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B. SQL经验自评 (SQL Experience Self-Assessment)</text><text x="50" y="310" fill="#7F8C8D" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">请根据下方1-5量表自评（1=完全不了解，5=非常熟悉）</text><text x="50" y="330" fill="#2C3E50" font-size="10" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">题目</text><text x="385" y="330" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">1</text><text x="385" y="342" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">完全不了解</text><rect x="372" y="335" width="16" height="16" fill="white" stroke="#3498DB" stroke-width="1.5" rx="3" ry="3" /><text x="475" y="330" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">2</text><text x="475" y="342" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">不太了解</text><rect x="462" y="335" width="16" height="16" fill="white" stroke="#3498DB" stroke-width="1.5" rx="3" ry="3" /><text x="565" y="330" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">3</text><text x="565" y="342" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">一般</text><rect x="552" y="335" width="16" height="16" fill="white" stroke="#3498DB" stroke-width="1.5" rx="3" ry="3" /><text x="655" y="330" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">4</text><text x="655" y="342" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">比较了解</text><rect x="642" y="335" width="16" height="16" fill="white" stroke="#3498DB" stroke-width="1.5" rx="3" ry="3" /><text x="745" y="330" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">5</text><text x="745" y="342" fill="#7F8C8D" font-size="8" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">非常熟悉</text><rect x="732" y="335" width="16" height="16" fill="white" stroke="#3498DB" stroke-width="1.5" rx="3" ry="3" /><text x="50" y="365" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B1. 我了解SQL的基本语法</text><rect x="372" y="355" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="462" y="355" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="552" y="355" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="642" y="355" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="732" y="355" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><text x="50" y="393" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B2. 我能写简单的SELECT查询</text><rect x="372" y="383" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="462" y="383" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="552" y="383" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="642" y="383" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="732" y="383" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><text x="50" y="421" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B3. 我理解WHERE条件过滤</text><rect x="372" y="411" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="462" y="411" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="552" y="411" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="642" y="411" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="732" y="411" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><text x="50" y="449" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B4. 我理解GROUP BY和聚合函数</text><rect x="372" y="439" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="462" y="439" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="552" y="439" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="642" y="439" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="732" y="439" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><text x="50" y="477" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B5. 我理解JOIN操作</text><rect x="372" y="467" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="462" y="467" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="552" y="467" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="642" y="467" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="732" y="467" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><text x="50" y="505" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">B6. 我理解子查询(Subquery)</text><rect x="372" y="495" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="462" y="495" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="552" y="495" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="642" y="495" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="732" y="495" width="16" height="16" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3" ry="3" /><rect x="30" y="543" width="840" height="180" fill="#FEF9E7" stroke="#F1C40F" stroke-width="1" rx="8" ry="8" /><text x="50" y="568" fill="#B7950B" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">C. 纳入标准确认 (Inclusion Criteria Checklist)</text><text x="60" y="588" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ C1. 年龄 ≥ 18岁</text><text x="60" y="610" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ C2. 非计算机科学/软件工程专业</text><text x="60" y="632" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ C3. SQL经验自评 ≤ 2/5（B1-B6均≤2）</text><text x="60" y="654" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ C4. 正常视力或已矫正（含色觉正常）</text><text x="60" y="676" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ C5. 能够使用电脑浏览器操作</text><text x="60" y="698" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">□ C6. 签署知情同意书</text><rect x="30" y="735" width="840" height="90" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1" rx="8" ry="8" /><text x="50" y="757" fill="#1F618D" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">统计效力信息 (G*Power Analysis)</text><text x="60" y="777" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 效应量 (Effect size): r &gt; 0.5 (中等效应)</text><text x="60" y="793" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• α = 0.05, Power (1−β) &gt; 0.80</text><text x="60" y="809" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">• 最小样本量: N = 28 → 实际招募 N = 30 (含2名替补)</text></svg>