<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" fill="#FAFBFC" stroke="#333" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="600.0" y="35" font-size="22" fill="#1a1a2e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Pipeline Flow: A SQL Query's Journey to Visualization</text><text x="600.0" y="58" font-size="13" fill="#666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Dual-Encoder Architecture → 16-Dim Fingerprint → β Modulation → Symbolic SVG Rendering</text><rect x="50" y="90" width="1100" height="70" fill="#fff" stroke="#3498DB" stroke-width="2" rx="8" ry="0" opacity="1.0" /><rect x="50" y="90" width="4" height="70" fill="#3498DB" stroke="#333" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="70" y="112" font-size="10" fill="#3498DB" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">INPUT</text><text x="70" y="132" font-size="12" fill="#333" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">NL: How many courses does each adult student take?</text><text x="70" y="152" font-size="11" fill="#666" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">SQL: SELECT name, COUNT(*) FROM students JOIN courses ON students.id = courses.sid WHERE age &gt; 18 GROUP BY name</text><path d="M 600 160 L 600 185" stroke="#999" stroke-width="2" fill="none" opacity="1.0" /><path d="M 595 180 L 600 185 L 605 180" stroke="#999" stroke-width="2" fill="none" opacity="1.0" /><rect x="80" y="190" width="240" height="120" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="8" ry="0" opacity="1.0" /><text x="200" y="210" font-size="14" fill="#2980B9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Encoder A</text><text x="200" y="228" font-size="10" fill="#7FB3D5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">XLM-RoBERTa (Frozen)</text><rect x="100" y="240" width="200" height="25" fill="#D6EAF8" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="200" y="256" font-size="11" fill="#2980B9" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">SQL → [CLS] embedding</text><rect x="100" y="275" width="200" height="25" fill="#AED6F1" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="200" y="291" font-size="11" fill="#1A5276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">e_s^A ∈ ℝ⁷⁶⁸</text><rect x="380" y="190" width="240" height="120" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="8" ry="0" opacity="1.0" /><text x="500" y="210" font-size="14" fill="#D68910" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Encoder B</text><text x="500" y="228" font-size="10" fill="#B7950B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">XLM-RoBERTa (Last 2 layers)</text><rect x="400" y="240" width="200" height="25" fill="#FCF3CF" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="500" y="256" font-size="11" fill="#D68910" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">SQL + NL → hidden states</text><rect x="400" y="275" width="200" height="25" fill="#F9E79F" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="500" y="291" font-size="10" fill="#7D6608" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">H_s^B, H_q^B ∈ ℝ^(L×768)</text><rect x="680" y="190" width="180" height="120" fill="#F5EEF8" stroke="#8E44AD" stroke-width="2" rx="8" ry="0" opacity="1.0" /><text x="770" y="210" font-size="14" fill="#7D3C98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">MLP Regressor</text><text x="770" y="228" font-size="10" fill="#A569BD" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">768→512→256→16</text><rect x="700" y="240" width="140" height="25" fill="#E8DAEF" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="770" y="256" font-size="11" fill="#7D3C98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">e_s^A → p_base</text><rect x="700" y="275" width="140" height="25" fill="#D2B4DE" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="770" y="291" font-size="11" fill="#5B2C6F" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">p_base ∈ ℝ¹⁶</text><rect x="900" y="190" width="220" height="120" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2" rx="8" ry="0" opacity="1.0" /><text x="1010" y="210" font-size="14" fill="#C0392B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Cross-Attention</text><text x="1010" y="228" font-size="10" fill="#EC7063" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">A = softmax(Hs·Hqᵀ/√d)</text><rect x="920" y="240" width="180" height="25" fill="#FADBD8" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="1010" y="256" font-size="11" fill="#C0392B" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Entropy → β (4-dim)</text><rect x="920" y="275" width="180" height="25" fill="#F1948A" stroke="#333" stroke-width="1" rx="4" ry="0" opacity="1.0" /><text x="1010" y="291" font-size="10" fill="#922B21" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">β = [ent, join, cond, res]</text><path d="M 320 250 L 680 250" stroke="#999" stroke-width="2" fill="none" opacity="1.0" stroke-dasharray="4,2" /><path d="M 675 245 L 680 250 L 675 255" stroke="#999" stroke-width="2" fill="none" opacity="1.0" /><path d="M 620 250 L 900 250" stroke="#999" stroke-width="2" fill="none" opacity="1.0" stroke-dasharray="4,2" /><path d="M 895 245 L 900 250 L 895 255" stroke="#999" stroke-width="2" fill="none" opacity="1.0" /><path d="M 770 310 L 770 350" stroke="#8E44AD" stroke-width="2" fill="none" opacity="1.0" stroke-dasharray="4,2" /><path d="M 1010 310 L 1010 350" stroke="#E74C3C" stroke-width="2" fill="none" opacity="1.0" stroke-dasharray="4,2" /><rect x="350" y="350" width="500" height="80" fill="#FFF3CD" stroke="#FFC107" stroke-width="2" rx="8" ry="0" opacity="1.0" /><text x="600.0" y="372" font-size="15" fill="#F57F17" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Parameter Synthesis</text><text x="600.0" y="395" font-size="14" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">p_final = p_base ⊙ (1 + 0.3 · β_expand)</text><text x="600.0" y="415" font-size="11" fill="#888" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Base fingerprint modulated by cross-attention entropy → 16 visual parameters</text><path d="M 600.0 430 L 600.0 460" stroke="#999" stroke-width="2" fill="none" opacity="1.0" /><path d="M 595.0 455 L 600.0 460 L 605.0 455" stroke="#999" stroke-width="2" fill="none" opacity="1.0" /><rect x="200" y="460" width="800" height="300" fill="#fff" stroke="#333" stroke-width="2" rx="8" ry="0" opacity="1.0" /><text x="600.0" y="482" font-size="15" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Symbolic SVG Rendering — Dual-Path Visual Encoding</text><rect x="230" y="505" width="120" height="80" fill="#4A90D9" stroke="#2E5C8A" stroke-width="2" rx="4" ry="0" opacity="0.7" /><rect x="230" y="505" width="120" height="22" fill="#2E5C8A" stroke="#333" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="290" y="521" font-size="11" fill="white" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">students</text><text x="290" y="547" font-size="10" fill="#2E5C8A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">name</text><text x="290" y="563" font-size="10" fill="#2E5C8A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">age</text><path d="M 350 545 C 390 545, 390 545, 420 545" stroke="#27AE60" stroke-width="3" fill="none" opacity="0.8" /><text x="385" y="535" font-size="9" fill="#27AE60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">JOIN</text><rect x="420" y="505" width="120" height="80" fill="#4A90D9" stroke="#2E5C8A" stroke-width="2" rx="4" ry="0" opacity="0.7" /><rect x="420" y="505" width="120" height="22" fill="#2E5C8A" stroke="#333" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="480" y="521" font-size="11" fill="white" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">courses</text><text x="480" y="547" font-size="10" fill="#2E5C8A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">sid</text><text x="480" y="563" font-size="10" fill="#2E5C8A" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">title</text><polygon points="280,600 360,600 345,635 295,635" fill="#E74C3C" stroke="#922B21" stroke-width="2.5" opacity="0.9" /><text x="320" y="618" font-size="10" fill="white" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Filter</text><text x="320" y="632" font-size="8" fill="white" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">age &gt; 18</text><text x="370" y="615" font-size="9" fill="#E74C3C" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">β_cond=0.73</text><text x="370" y="628" font-size="8" fill="#E74C3C" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">HIGH → Pop-out!</text><rect x="520" y="620.0" width="20" height="30.0" fill="#F39C12" stroke="#A04000" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="530.0" y="662" font-size="7" fill="#666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Alice</text><rect x="548" y="610.0" width="20" height="40.0" fill="#E67E22" stroke="#A04000" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="558.0" y="662" font-size="7" fill="#666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Bob</text><rect x="576" y="630.0" width="20" height="20.0" fill="#D35400" stroke="#A04000" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="586.0" y="662" font-size="7" fill="#666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Carol</text><text x="550" y="675" font-size="9" fill="#D35400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">GROUP BY name</text><text x="550" y="688" font-size="8" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">COUNT(*)</text><rect x="650" y="510" width="140" height="70" fill="#58D68D" stroke="#1E8449" stroke-width="2" rx="4" ry="0" opacity="0.6" /><rect x="650" y="510" width="140" height="20" fill="#1E8449" stroke="#333" stroke-width="1" rx="0" ry="0" opacity="1.0" /><text x="720" y="525" font-size="10" fill="white" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Result</text><text x="720" y="548" font-size="10" fill="#1E8449" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">name, COUNT(*)</text><text x="720" y="565" font-size="9" fill="#27AE60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">3 rows</text><rect x="820" y="505" width="150" height="120" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="6" ry="0" opacity="1.0" /><text x="895" y="520" font-size="10" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">NL Attention Words</text><text x="830" y="535" font-size="9" fill="#333" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">adult</text><rect x="885" y="528" width="55.2" height="8" fill="#3498DB" stroke="#333" stroke-width="1" rx="2" ry="0" opacity="0.7" /><text x="950" y="535" font-size="8" fill="#3498DB" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">0.92</text><text x="830" y="557" font-size="9" fill="#333" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">courses</text><rect x="885" y="550" width="52.8" height="8" fill="#3498DB" stroke="#333" stroke-width="1" rx="2" ry="0" opacity="0.7" /><text x="950" y="557" font-size="8" fill="#3498DB" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">0.88</text><text x="830" y="579" font-size="9" fill="#333" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">each</text><rect x="885" y="572" width="45.0" height="8" fill="#E67E22" stroke="#333" stroke-width="1" rx="2" ry="0" opacity="0.7" /><text x="950" y="579" font-size="8" fill="#E67E22" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">0.75</text><text x="830" y="601" font-size="9" fill="#333" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">how many</text><rect x="885" y="594" width="51.0" height="8" fill="#27AE60" stroke="#333" stroke-width="1" rx="2" ry="0" opacity="0.7" /><text x="950" y="601" font-size="8" fill="#27AE60" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">0.85</text><text x="600.0" y="740" font-size="11" fill="#E74C3C" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">High β_cond (0.73) → WHERE filter rendered as Visual Pop-out (red, opaque, shadow)</text><text x="600.0" y="755" font-size="10" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Low β values → other primitives rendered as Active De-emphasis (grayscale, transparent)</text></svg>