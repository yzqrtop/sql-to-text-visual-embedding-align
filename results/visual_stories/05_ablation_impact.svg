UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Layout drifts, primitives overlap</text><text x="340.0" y="124.79999999999995" font-size="16" fill="#E74C3C" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">⚓</text><rect x="420" y="246.0" width="120" height="174.0" fill="#E67E22" stroke="#E67E22" stroke-width="1.5" rx="4" ry="0" opacity="0.7" /><text x="480.0" y="238.0" font-size="13" fill="#E67E22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">-24.0%</text><text x="480.0" y="221.0" font-size="10" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">76.0%</text><text x="480.0" y="435" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">–</text><text x="480.0" y="447" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Cognitive Constraints</text><text x="480.0" y="464" font-size="7" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Visual chaos, no limits on density</text><text x="480.0" y="206.0" font-size="16" fill="#E67E22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">🧠</text><rect x="560" y="256.15" width="120" height="163.85000000000002" fill="#F39C12" stroke="#F39C12" stroke-width="1.5" rx="4" ry="0" opacity="0.7" /><text x="620.0" y="248.14999999999998" font-size="13" fill="#F39C12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">-22.6%</text><text x="620.0" y="231.14999999999998" font-size="10" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">77.4%</text><text x="620.0" y="435" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">–</text><text x="620.0" y="447" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Context Bounding Boxes</text><text x="620.0" y="464" font-size="7" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Subqueries lose spatial containment</text><text x="620.0" y="216.14999999999998" font-size="16" fill="#F39C12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">📦</text><rect x="700" y="275.0" width="120" height="145.0" fill="#8E44AD" stroke="#8E44AD" stroke-width="1.5" rx="4" ry="0" opacity="0.7" /><text x="760.0" y="267.0" font-size="13" fill="#8E44AD" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">-20.0%</text><text x="760.0" y="250.0" font-size="10" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">80.0%</text><text x="760.0" y="435" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">–</text><text x="760.0" y="447" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">MLP Regression</text><text x="760.0" y="464" font-size="7" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">Hardcoded rules miss nuance</text><text x="760.0" y="235.0" font-size="16" fill="#8E44AD" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">📐</text><rect x="840" y="415" width="120" height="5" fill="#3498DB" stroke="#333" stroke-width="1" rx="2" ry="0" opacity="1.0" /><text x="900.0" y="405" font-size="11" fill="#3498DB" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">100%</text><text x="900.0" y="435" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">–</text><text x="900.0" y="447" font-size="9" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">NL Channel Input</text><text x="900.0" y="464" font-size="7" fill="#999" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">NL doesn't affect layout success (but affects β)</text><text x="900.0" y="390" font-size="16" fill="#3498DB" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">📝</text><rect x="80" y="500" width="840" height="120" fill="#fff" stroke="#E0E0E0" stroke-width="1" rx="8" ry="0" opacity="1.0" /><text x="500" y="525" font-size="15" fill="#333" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" opacity="1.0">Key Insights</text><text x="100" y="550" font-size="10" fill="#555" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">⚓  Anchor Constraints are the most critical (–35.2%): Without spatial anchoring, visual primitives drift and overlap, making the visualization unreadable.</text><text x="100" y="568" font-size="10" fill="#555" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">🧠  Cognitive Constraints matter (–24.0%): Without density/overlap limits, complex queries produce visual chaos that overwhelms the user.</text><text x="100" y="586" font-size="10" fill="#555" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">📦  Context Bounding Boxes are essential for subqueries (–22.6%): Spatial containment is the core metaphor for nested query understanding.</text><text x="100" y="604" font-size="10" fill="#555" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" opacity="1.0">📐  MLP Regression outperforms rules (–20.0%): Learned mapping captures nuanced SQL-property relationships that hardcoded heuristics miss.</text></svg>