normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误SQL缺少GROUP BY子句，</text><text x="110" y="651" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">COUNT(*)会对全表聚合，返回总人数而非每部门人数；</text><text x="110" y="665" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">部门列和聚合结果不匹配</text><text x="620" y="637" fill="#B7950B" font-size="12" font-weight="bold" font-family="Helvetica, Arial, sans-serif" text-anchor="start">视觉判别线索:</text><text x="700" y="637" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">注意堆叠柱(Stack)的分组：</text><text x="700" y="651" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">正确→有多组柱状条，每组对应一个部门</text><text x="700" y="665" fill="#2C3E50" font-size="10" font-weight="normal" font-family="Helvetica, Arial, sans-serif" text-anchor="start">错误→只有一组柱状条（全表聚合）</text></svg>