" fill-opacity="0.14" rx="2" /><text x="476.9986879825592" y="427.01353311538696" fill="#27AE60" font-size="10" font-weight="normal">7000</text><rect x="521.4186879825592" y="419.01353311538696" width="9.58" height="8" fill="#27AE60" fill-opacity="0.14" rx="2" /><text x="20" y="545.6526803970337" fill="#2C3E50" font-size="12" font-weight="bold">Query: </text><text x="70" y="545.6526803970337" fill="#34495E" font-size="11">Depts with avg salary &gt; 7000 for employees &gt; 30 ye...</text><text x="20" y="559.6526803970337" fill="#2C3E50" font-size="11" font-weight="bold">SQL: </text><text x="60" y="575.6526803970337" fill="#7F8C8D" font-size="10">SELECT d.name, AVG(e.salary) FROM departments d JOIN employees e ON d.id = e.dept_id WHERE</text><text x="60" y="587.6526803970337" fill="#7F8C8D" font-size="10">e.age &gt; 30 GROUP BY d.name HAVING AVG(e.salary) &gt; 7000</text></svg>