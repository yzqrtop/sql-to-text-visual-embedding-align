" font-weight="bold">SQL: </text><text x="60" y="432.86802673339844" fill="#7F8C8D" font-size="10">SELECT s.name FROM students s WHERE s.id IN (SELECT sid FROM enrollments WHERE cid IN</text><text x="60" y="444.86802673339844" fill="#7F8C8D" font-size="10">(SELECT id FROM courses WHERE pid IN (SELECT pid FROM professors GROUP BY pid HAVING</text><text x="60" y="456.86802673339844" fill="#7F8C8D" font-size="10">COUNT(*) &gt; 5)))</text></svg>