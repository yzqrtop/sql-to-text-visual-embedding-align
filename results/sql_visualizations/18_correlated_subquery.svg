 x="60" y="433.75918531417847" fill="#7F8C8D" font-size="10">SELECT e.name FROM employees e WHERE e.salary &gt; (SELECT AVG(salary) FROM employees WHERE</text><text x="60" y="445.75918531417847" fill="#7F8C8D" font-size="10">dept_id = e.dept_id)</text></svg>