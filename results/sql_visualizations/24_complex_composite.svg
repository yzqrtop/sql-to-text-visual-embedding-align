.21" rx="2" /><rect x="436.7770395874977" y="380.323429107666" width="70" height="70" fill="#27AE60" fill-opacity="0.08" stroke="#27AE60" stroke-width="1" stroke-dasharray="3,2" rx="4" ry="4" /><text x="442.7770395874977" y="393.323429107666" fill="#27AE60" font-size="9" font-weight="bold">NL attn: Result</text><line x1="436.7770395874977" y1="415.323429107666" x2="424.7770395874977" y2="422.7031660079956" stroke="#27AE60" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" /><text x="444.7770395874977" y="408.323429107666" fill="#27AE60" font-size="10" font-weight="normal">per</text><rect x="486.7370395874977" y="400.323429107666" width="12.04" height="8" fill="#27AE60" fill-opacity="0.18" rx="2" /><text x="444.7770395874977" y="424.323429107666" fill="#27AE60" font-size="10" font-weight="normal">CS</text><rect x="488.3370395874977" y="416.323429107666" width="10.440000000000001" height="8" fill="#27AE60" fill-opacity="0.16" rx="2" /><text x="444.7770395874977" y="440.323429107666" fill="#27AE60" font-size="10" font-weight="normal">over</text><rect x="488.43703958749774" y="432.323429107666" width="10.34" height="8" fill="#27AE60" fill-opacity="0.16" rx="2" /><text x="20" y="554.433256983757" fill="#2C3E50" font-size="12" font-weight="bold">Query: </text><text x="70" y="554.433256983757" fill="#34495E" font-size="11">Most popular course per major for CS students over...</text><text x="20" y="568.433256983757" fill="#2C3E50" font-size="11" font-weight="bold">SQL: </text><text x="60" y="584.433256983757" fill="#7F8C8D" font-size="10">SELECT m.major, c.title, COUNT(*) FROM majors m JOIN students s ON m.id = s.mid JOIN</text><text x="60" y="596.433256983757" fill="#7F8C8D" font-size="10">enrollments e ON s.id = e.sid JOIN courses c ON e.cid = c.id WHERE m.name='CS' AND s.age &gt;</text><text x="60" y="608.433256983757" fill="#7F8C8D" font-size="10">20 GROUP BY m.major, c.title HAVING COUNT(*) &gt;= 3 ORDER BY COUNT(*) DESC</text></svg>