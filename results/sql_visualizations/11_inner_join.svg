urses.</text><text x="20" y="380.8829929828644" fill="#2C3E50" font-size="11" font-weight="bold">SQL: </text><text x="60" y="396.8829929828644" fill="#7F8C8D" font-size="10">SELECT s.name, c.title FROM students s INNER JOIN courses c ON s.id = c.student_id</text></svg>